<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form action="/creer_compte" method="get">
            <h1>Inscription</h1>
            <input type="text" name="identifiant" placeholder="Veuillez saisir un identifiant">
            <input type="text" name="mot_de_passe" placeholder="Veuillez saisir un mot de passe">
            <input type="button" name="creer_le_compte" value="Créer le compte">
        </form>
        <form action="/retour" method="get">
            <input type="button" name="retour" value="Retour">
        </form>
    </body>
</html>
