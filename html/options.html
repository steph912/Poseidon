<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-musique="menu">
    
        <h1>Options</h1>
        
        <form class="form_option" action="/req_accueil" method="get">
            
            <div class="option">
                Timer
                <div class="switch">
                    <input type="hidden" name="timer" value="off">
                    <input type="checkbox" id="timer" name="timer" value="on">
                    <div class="slider"></div>
                </div>
            </div>


            <div class="option">
                Missiles spéciaux
                <div class="switch">
                    <input type="hidden" name="missiles" value="off">
                    <input type="checkbox" id="missiles" name="missiles" value="on" checked>
                    <div class="slider"></div>
                </div>
            </div>
            
            
            <div class="option">
                Niveau de l'IA
                <select id="ia-level" name="ia_level">
                    <option value="facile">Facile</option>
                    <option value="normal">Normal</option>
                    <option value="difficile">Difficile</option>
                </select>
            </div>
    
            
            <div class="retour">
                <input type="hidden" name="pseudo" value="{{ pseudo }}">
                <input type="hidden" name="password" value="{{ password }}">
                <input type="submit" value="Appliquer et revenir à l'accueil">
            </div>
        </form>
	<script src="/musique.js" defer></script>
</body>
</html>
