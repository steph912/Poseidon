<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Accueil</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-musique="menu">
        <div class="accueil">
            
            <img class="logo" src="./img/logo.png">

            <form class="accueil_a_propos" action="/req_a_propos" method="get">
                <input type="hidden" name="pseudo" value="{{ pseudo }}">
                <input type="hidden" name="password" value="{{ password }}">
                <input type="submit" value="A propos" />
            </form>

            
            <form action="/req_jouer_contre_ordinateur" method="get">
                <input type="hidden" name="pseudo" value="{{ pseudo }}">
                <input type="hidden" name="password" value="{{ password }}">
                <input type="hidden" name="timer" value="{{ timer }}">
                <input type="hidden" name="missiles" value="{{ missiles }}">
                <input type="hidden" name="ia_level" value="{{ ia_level }}">
                <input type="submit" name="mode" value="Jouer contre l'ordinateur">
            </form>

            <form class="accueil_option" action="/req_options" method="get">
                <input type="hidden" name="pseudo" value="{{ pseudo }}">
                <input type="hidden" name="password" value="{{ password }}">
                <input type="submit" value="Options"/>
            </form>
        
            <form action="/req_jouer_en_ligne" method="get">
                <input type="hidden" name="pseudo" value="{{ pseudo }}">
                <input type="hidden" name="password" value="{{ password }}">
                <input type="submit" value="Jouer contre un joueur"/>
            </form>

            <div class="bienvenue"> Bienvenue {{pseudo}}</div>
            <div class="erreur">{{ erreur }}</div>
        </div>

        <form class="retour" action="/req_commencer" method="get">
            <input type="submit" value="Se déconnecter">
        </form>
        

    	<script src="/musique.js" defer></script>
</body>
</html>
