<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<title>Jouer contre un autre joueur</title>
        <link rel="stylesheet" href="style.css">
	</head>
	<body>
        <div class="jouer_en_ligne">
            <h1>Jouer avec un autre joueur</h1>

            <section>
                <input type="text" placeholder="Veuillez saisir un code de partie">
                <form action="placez_vos_bateaux.html" method="get">
                    <input type="submit" name="mode" value="Rejoindre la partie">
                </form>
            </section>
            {{erreur}}
            <section>
                <p>Je veux créer la partie </p>
                <form action="/req_creer_une_partie" method="get">
                    <input type="submit" value="Créer la partie">
                </form>
                <form class="retour" action="/req_acceuil" method="get">
                    <input type="submit" value="retour">
                </form>
            </section>
        </div>
	</body>
</html>
