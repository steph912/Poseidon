    <div class="gagner">
        <h1>GAGNÉ !</h1>
        <p>Score : {{ score }}</p>
        <form class="retour" action="/req_classement" method="get">
            <input type="hidden" name="pseudo" value="{{ pseudo }}">
            <input type="hidden" name="password" value="{{ password }}">
            <input type="hidden" name="score" value="{{ score }}">
            <input type="submit" value="Suivant">
        </form>
    </div>
	{% if son %}
	<script>
		(function () {
			var fichiers = { eau: "/sons/plouf.mp3", touche: "/sons/explosion_petite.mp3", coule: "/sons/explosion_grosse.mp3" };
			var fichier = fichiers["{{ son }}"];
			if (fichier) {
				var effet = new Audio(fichier);
				effet.volume = 0.8;
				effet.play().catch(function () { /* lecture bloquée, tant pis */ });
			}
		})();
	</script>
	{% endif %}
	<script src="/musique.js" defer></script>
