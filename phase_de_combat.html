<!DOCTYPE html>

  <title>Phase de Combat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ffffff;
      margin: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      margin: 10px 0;
    }

    .grids-container {
      display: flex;
      justify-content: center;
      gap: 300px; 
    }

    .grid-container {
      display: grid;
      grid-template-columns: 20px repeat(10, 40px); 
      grid-template-rows: 20px repeat(10, 40px);   
      gap: 0;
      margin: 0 auto;
    }

    .header {
      background-color: transparent;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .side {
      background-color: transparent;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cell {
      width: 40px;
      height: 40px;
      border: 1px solid #000;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0d9b5;
      cursor: pointer;
      
    }

    .cell::before {
      content: "•"; 
      font-size: 16px;
      color: #000;
    }

    .rules {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background-color: #c0bdbd;
  padding: 15px;
  border-radius: 15px; 
  max-width: 500px;
  font-size: 16px;
  text-align: left;
  color: black; 
}

    .cubes-container {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 0px; 
    }

    .cube {
      width: 140px;
      height: 140px;
      background-color: #ffffff; 
      border: 1px solid #333;
    }
    
  </style>
</head>
