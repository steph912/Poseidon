<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .options-container {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ddd;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #bbb;
        }
    </style>
</head>
<body>
    
    
        <h1>Options</h1>
        
        <form action="/req_acceuil" method="get">
            
            <div class="option">
                Timer
                <div class="switch">
                    <input type="checkbox" id="timer" name="timer">
                    <div class="slider"></div>
                </div>
            </div>
            
        
            <div class="option">
                Missiles spéciaux
                <div class="switch">
                    <input type="checkbox" id="missiles" name="missiles">
                    <div class="slider"></div>
                </div>
            </div>
            
            
            <div class="option">
                Niveau de l'IA
                <select id="ia-level" name="ia_level">
                    <option value="facile">Facile</option>
                    <option value="normal">Normal</option>
                    <option value="difficile">Difficile</option>
                </select>
            </div>
    
            
            <div class="retour">
                <input type="submit" value="Appliquer et revenir à l'accueil">
            </div>
        </form>
        
    
    
</body>
</html>
