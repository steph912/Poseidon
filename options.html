<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <h1>Options</h1>
        
        <form class="form_option" action="/req_acceuil" method="get">
            
            <div class="option">
                Timer
                <div class="switch">
                    <input type="checkbox" id="timer" name="timer">
                    <div class="slider"></div>
                </div>
            </div>
            
        
            <div class="option">
                Missiles spéciaux
                <div class="switch">
                    <input type="checkbox" id="missiles" name="missiles">
                    <div class="slider"></div>
                </div>
            </div>
            
            
            <div class="option">
                Niveau de l'IA
                <select id="ia-level" name="ia_level">
                    <option value="facile">Facile</option>
                    <option value="normal">Normal</option>
                    <option value="difficile">Difficile</option>
                </select>
            </div>
    
            
            <div class="retour">
                <input type="submit" value="Appliquer et revenir à l'accueil">
            </div>
        </form>
</body>
</html>
