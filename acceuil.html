<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Acceuil</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="acceuil">
            
            <img class="logo" src="logo.png">

            <form class="acceuil_a_propos" action="a_propos.html" method="get">
                <input type="submit" value="A propos" />
            </form>

            <form action="placez_vos_bateaux.html" method="get">
                <input type="submit" name="mode" value="Jouer contre l'ordinateur">
            </form>

            <form class="acceuil_option" action="options.html" method="get">
                <input type="submit" value="Options"/>
            </form>
        
            <form action="jouer_contre_un_joueur.html" method="get">
                <input type="submit" value="Jouer contre un joueur"/>
            </form>

            <div class="bienvenue"> Bienvenue {{pseudo}}</div>
            <div class="erreur">{{ erreur }}</div>
        </div>

        <form class="retour" action="connexion.html" method="get">
            <input type="submit" value="Se déconnecter">
        </form>
        

    </body>
</html>
