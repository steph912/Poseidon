<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="inscription">
            <form action="/req_inscription" method="get">
                <h1>Inscription</h1>
                <input type="text" name="pseudo" placeholder="Veuillez saisir un identifiant">
                <input type="password" name="password" placeholder="Veuillez saisir un mot de passe">
                <div class="erreur" >{{ erreur }}{{ pseudo }}</div>
                <input type="submit" value="Créer le compte">
            </form>
            <form class="retour" action="connexion.html" method="get">
                <input type="submit" name="retour" value="Retour">
            </form>
        </div>
    </body>
</html>
